name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # If you use Next.js ESLint; otherwise use your linter cmd
      - name: Lint
        run: npm run lint --if-present || npx next lint

      # Type-checks the whole project without emitting files
      - name: Typecheck
        run: npx tsc --noEmit

      # Note: Build step is optional and may fail without secrets
      # Secrets are only needed for running the app, not for lint/typecheck
      # To enable build in CI, add these secrets to GitHub repository settings:
      #   - OPENAI_API_KEY
      #   - MISTRAL_API_KEY
      #   - HELICONE_API_KEY
      #   - NEXT_PUBLIC_SUPABASE_URL
      #   - NEXT_PUBLIC_SUPABASE_ANON_KEY
      #   - NEXT_PUBLIC_SITE_URL
      # Then uncomment the build step below:
      #
      # - name: Build
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #     MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      #     HELICONE_API_KEY: ${{ secrets.HELICONE_API_KEY }}
      #     NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      #     NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      #     NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      #   run: npm run build
